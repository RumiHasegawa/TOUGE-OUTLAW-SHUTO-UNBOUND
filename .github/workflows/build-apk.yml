name: 🏎️ Build APK - TOUGE OUTLAW SHUTO UNBOUND

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Bisa di-trigger manual dari tombol 'Run workflow' di GitHub Actions

jobs:
  build-apk:
    name: Build Android APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      # --- 1. Checkout kode game ---
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      # --- 2. Setup Node.js untuk Capacitor CLI ---
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- 3. Setup Java JDK 17 untuk Gradle/Android ---
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # --- 4. Install semua dependency Capacitor ---
      - name: 📥 Install NPM Dependencies (Capacitor)
        run: |
          npm install --no-audit --prefer-offline

      # --- 5. Siapkan folder web (www) untuk Capacitor ---
      - name: 📁 Prepare Web Directory (www)
        run: |
          mkdir -p www
          cp -r index.html manifest.json assets src models www/

      # --- 6. Tambah Platform Android & Sync aset game ---
      - name: 📱 Setup Android Platform & Sync Web Assets
        run: |
          npx cap add android || true
          npx cap sync android

      # --- 7. Beri izin eksekusi pada Gradle wrapper ---
      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      # --- 8. Build APK Debug (ARM64/Universal) ---
      - name: 🔨 Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      # --- 9. Upload hasil APK sebagai GitHub Actions Artifact ---
      - name: 📤 Upload APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TougeOutlaw-ShutoUnbound-v1.0-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
