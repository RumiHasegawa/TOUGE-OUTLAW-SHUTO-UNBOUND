name: 🏎️ Build APK - TOUGE OUTLAW SHUTO UNBOUND

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Bisa di-trigger manual dari tombol 'Run workflow' di GitHub Actions

jobs:
  build-apk:
    name: Build Android APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      # --- 1. Checkout kode game ---
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      # --- 2. Setup Node.js untuk Capacitor CLI ---
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- 3. Setup Java JDK 17 untuk Gradle/Android ---
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # --- 4. Install ImageMagick untuk konversi ikon ---
      - name: 🖼️ Install ImageMagick
        run: sudo apt-get install -y imagemagick

      # --- 5. Install semua dependency Capacitor ---
      - name: 📥 Install NPM Dependencies (Capacitor)
        run: |
          npm install --no-audit --prefer-offline

      # --- 6. Siapkan folder web (www) untuk Capacitor ---
      - name: 📁 Prepare Web Directory (www)
        run: |
          mkdir -p www
          cp -r index.html manifest.json assets src models lib www/

      # --- 7. Tambah Platform Android & Sync aset game ---
      - name: 📱 Setup Android Platform & Sync Web Assets
        run: |
          npx cap add android || true
          npx cap sync android

      # --- 8. Generate & Pasang Ikon Honda NSX ke semua ukuran Android ---
      - name: 🎨 Generate Android App Icons (NSX Mobil 1 GT4)
        run: |
          SRC="assets/icon.png"

          # mipmap-mdpi (48x48)
          mkdir -p android/app/src/main/res/mipmap-mdpi
          convert "$SRC" -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$SRC" -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          # mipmap-hdpi (72x72)
          mkdir -p android/app/src/main/res/mipmap-hdpi
          convert "$SRC" -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$SRC" -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          # mipmap-xhdpi (96x96)
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          convert "$SRC" -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$SRC" -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          # mipmap-xxhdpi (144x144)
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          convert "$SRC" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$SRC" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          # mipmap-xxxhdpi (192x192)
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert "$SRC" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert "$SRC" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          echo "✅ Icon Honda NSX Mobil 1 GT4 berhasil dipasang ke semua ukuran mipmap!"

      # --- 9. Beri izin eksekusi pada Gradle wrapper ---
      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      # --- 10. Build APK Debug ---
      - name: 🔨 Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TougeOutlaw-ShutoUnbound-v1.0.apk

      # --- 11. Upload hasil APK sebagai GitHub Actions Artifact ---
      - name: 📤 Upload APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TougeOutlaw-ShutoUnbound-v1.0-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
