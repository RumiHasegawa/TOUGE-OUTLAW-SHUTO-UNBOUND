name: 🏎️ Build APK - TOUGE OUTLAW SHUTO UNBOUND

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Bisa di-trigger manual dari GitHub UI

jobs:
  build-apk:
    name: Build Android APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      # --- 1. Checkout kode game ---
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      # --- 2. Setup Node.js untuk Capacitor CLI ---
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --- 3. Setup Java JDK 17 untuk Gradle/Android ---
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # --- 4. Cache npm packages supaya build lebih cepat ---
      - name: 💾 Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # --- 5. Cache Gradle untuk build Android lebih cepat ---
      - name: 💾 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # --- 6. Install semua dependency Capacitor ---
      - name: 📥 Install NPM Dependencies (Capacitor)
        run: npm ci

      # --- 7. Sync aset game HTML5 ke Android project ---
      - name: 🔄 Sync Web Assets ke Android via Capacitor
        run: npx cap sync android

      # --- 8. Beri izin eksekusi pada Gradle wrapper ---
      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      # --- 9. Build APK Debug (tidak perlu signing key) ---
      - name: 🔨 Build Android APK (Debug - ARM64)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # --- 10. Upload hasil APK sebagai GitHub Actions Artifact ---
      - name: 📤 Upload APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TougeOutlaw-ShutoUnbound-v1.0-arm64-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # --- OPTIONAL: Build Release APK (uncomment jika sudah punya keystore) ---
      # - name: 🔐 Sign Release APK
      #   run: |
      #     cd android
      #     ./gradlew assembleRelease \
      #       -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
      #       -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
      #       -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
      #       -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
